name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Deny by default. Each job opts back into exactly what it needs, so a
# compromised dependency in a build step cannot write to the repository.
permissions: {}

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Front end
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # No git credentials are needed after the clone, so do not leave a
          # token sitting in .git/config for the rest of the job.
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `pnpm build` is `tsc && vite build`, so this is the typecheck too.
      - name: Typecheck and build
        run: pnpm build

      - name: Self-checks
        run: |
          node --experimental-strip-types src/lib/time.check.ts
          node --experimental-strip-types src/types/chat.check.ts

  rust:
    name: Back end
    # Windows only, and not for CI convenience: the now-playing reader talks
    # to WinRT's media session manager, which exists nowhere else.
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # tauri-build resolves `frontendDist` at compile time, so the Rust side
      # does not compile until the front end has been built at least once.
      - name: Build the front end
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # The nowplaying tests read this machine's live media session, which a
      # headless runner does not have. Everything else runs.
      # Quoted because a plain YAML scalar may not end in a colon.
      - name: Tests
        run: "cargo test --manifest-path src-tauri/Cargo.toml -- --skip nowplaying::"
